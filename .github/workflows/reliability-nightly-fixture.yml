name: Reliability Fixture Nightly

on:
  schedule:
    - cron: '0 20 * * *' # Daily 06:00 AEST / 07:00 AEDT (20:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Standard env
        uses: ./.github/actions/standard-ci-env

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deterministic checks
        run: |
          set -euo pipefail
          bun run typecheck
          bun test --recursive

      - name: Fixture reliability smoke (no API keys)
        run: |
          set -euo pipefail
          bun run eval:live \
            --mock \
            --repeats=1 \
            --sources=reddit,x \
            --topics="Bun runtime|TypeScript 5.9|Node.js LTS" \
            --timeoutMs=30000 \
            --out=reports/live-compare.fixture-nightly.json \
            --csv=reports/live-compare.fixture-nightly.csv

      - name: Fixture smoke assertions
        run: |
          set -euo pipefail
          bun -e '
            const fs = require("node:fs");
            const p = "reports/live-compare.fixture-nightly.json";
            const payload = JSON.parse(fs.readFileSync(p, "utf8"));
            const rows = payload.records || [];
            const current = rows.filter((r) => r.impl === "current");
            if (current.length === 0) throw new Error("No current records found");
            const failures = current.filter((r) => !r.success);
            if (failures.length > 0) {
              throw new Error("Fixture smoke has " + failures.length + " failing current runs");
            }
            console.log(JSON.stringify({
              current_runs: current.length,
              current_failures: failures.length
            }, null, 2));
          '

      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reliability-fixture-nightly-${{ github.run_id }}
          path: |
            reports/live-compare.fixture-nightly.json
            reports/live-compare.fixture-nightly.csv
          retention-days: 30

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Reliability Fixture Nightly"
            echo ""
            echo "- Deterministic checks: typecheck + test"
            echo "- Fixture smoke: eval:live --mock"
            echo "- Artifact JSON: \`reports/live-compare.fixture-nightly.json\`"
            echo "- Artifact CSV: \`reports/live-compare.fixture-nightly.csv\`"
          } >> "$GITHUB_STEP_SUMMARY"
